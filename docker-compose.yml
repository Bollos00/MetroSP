services:
  web:
    build: .
    ports:
      - "80:80"
    # volumes:
    depends_on:
      - neo4j
    restart: on-failure
  neo4j:
    image: neo4j:enterprise
    restart: unless-stopped
    ports:
      - 7474:7474
      - 7687:7687
    # volumes:
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/password
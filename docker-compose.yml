services:
  app:
    build: ./app
    ports:
      - "80:80"
    # volumes:
    depends_on:
      - neo4jdb
      - postgresdb
    restart: on-failure
    networks:
      - postgress_net
      - neo4j_net
  neo4jdb:
    image: neo4j:4.4.0-enterprise
    restart: unless-stopped
    ports:
      - 7474:7474
      - 7687:7687
    # volumes:
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=neo4j/password
      - NEO4JLABS_PLUGINS=["apoc"]
    networks:
      - neo4j_net
  postgresdb:
    image: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_SERVER: postgresserver
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    networks:
      - postgress_net
  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - postgresdb
    environment:
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:5050"
    networks:
      - postgress_net

networks:
  neo4j_net:
  postgress_net:
